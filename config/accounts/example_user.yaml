# RegimeDesk account config — example user.
#
# SAFETY MODEL (also enforced in code — see core/config_loader.py):
# - mode defaults to paper and can ONLY be changed by manually editing this
#   file. No code path, agent, or LLM can set it (load_account refuses
#   programmatic overrides of mode/risk disclosure).
# - mode: live requires risk_disclosure_accepted: true plus the timestamp
#   below. If it is false, every live order is refused regardless of any
#   other setting.
# - Credentials are never logged.
user_id: example_user
broker: mt5
mode: paper
auto_trade: off  # off | paper | live (edit this file by hand; never settable by code or LLM)
risk_disclosure_accepted: false
risk_disclosure_accepted_at: null
daily_drawdown_limit_pct: 3.0
weekly_drawdown_limit_pct: 6.0

# --- Credentials: this file OR environment variables ---
# Leave REPLACE_ME here and export the env vars instead if you prefer
# (file value wins, env is the fallback; either way nothing is logged):
#   MT5_LOGIN, MT5_PASSWORD, MT5_SERVER   (live MT5 execution only)
#   OANDA_API_KEY                          (optional live market data)
mt5_login: "REPLACE_ME"
mt5_password: "REPLACE_ME"
mt5_server: "REPLACE_ME"

# --- LLM brain (advisory only; negative-only power — can skip a signal,
# never create, resize or approve one; RiskManager stays authoritative) ---
# llm_provider: ollama   # ollama (default — local, free, no API key) | openai | off
# llm_model: llama3.2    # any model you pulled, e.g. `ollama pull llama3.2`
# llm_url: http://localhost:11434
